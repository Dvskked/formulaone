<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FORMULA 1: PREDESTINATO</title>
<meta name="description" content="Predestinato: juego de Formula 1 en el navegador. Modo carrera de piloto al estilo FIFA: empieza en Formula 2, escala hasta Formula 1, con garaje, buzon, calendario, sprints y carreras vistas desde arriba." />
<meta name="theme-color" content="#05060a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0b10'/%3E%3Cpath d='M14 12h30l-3 10H17z' fill='%23e8112d'/%3E%3Cpath d='M17 26h27l-4 12H20z' fill='%23fff'/%3E%3Cpath d='M20 42h22l-3 10H17z' fill='%23e8112d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ══════════════════ PANTALLA DE CARGA ══════════════════ -->
<div id="boot" class="boot">
  <canvas id="boot-canvas" class="boot-canvas" aria-hidden="true"></canvas>
  <div class="boot-inner">
    <div class="boot-logo">
      <span class="f1">FORMULA</span><span class="one">1</span><span class="sub">PREDESTINATO</span>
    </div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-meta">
      <span id="boot-status">Iniciando sistemas</span>
      <span id="boot-pct">0%</span>
    </div>
    <p class="boot-tip" id="boot-tip">Cargando…</p>
  </div>
  <p class="boot-legal">Juego de fans, no oficial. Sin relación con Formula One, la FIA ni los equipos citados.</p>
</div>

<!-- ══════════════════ MENÚ PRINCIPAL ══════════════════ -->
<div id="menu" class="menu" hidden>
  <div class="menu-bg" aria-hidden="true"><canvas id="menu-canvas"></canvas></div>
  <header class="menu-top">
    <div class="brand">
      <span class="f1">FORMULA</span><span class="one">1</span><span class="sub">PREDESTINATO</span>
    </div>
    <div class="menu-top-actions">
      <button class="btn btn-ghost" id="menu-sound" type="button" aria-pressed="true">Sonido ON</button>
      <button class="btn btn-ghost" id="menu-settings" type="button">Ajustes</button>
    </div>
  </header>
  <main class="menu-main">
    <div class="menu-cards">
      <button class="menu-card menu-card-continue" id="mc-continue" type="button">
        <span class="menu-card-tag">Continuar</span>
        <span class="menu-card-title" id="mc-continue-title">Modo Carrera</span>
        <span class="menu-card-desc" id="mc-continue-desc">No hay ninguna carrera guardada en este dispositivo.</span>
        <span class="menu-card-go">Continuar carrera →</span>
      </button>
      <button class="menu-card menu-card-new" id="mc-new" type="button">
        <span class="menu-card-tag">Nuevo</span>
        <span class="menu-card-title">Nueva carrera</span>
        <span class="menu-card-desc">Crea tu piloto y tu escudería, o elige un asiento en la parrilla de F2.</span>
        <span class="menu-card-go">Empezar →</span>
      </button>
      <button class="menu-card" id="mc-saves" type="button">
        <span class="menu-card-tag">Partidas</span>
        <span class="menu-card-title">Partidas guardadas</span>
        <span class="menu-card-desc">Autoguardado local. Tres huecos, sin cuentas ni nube.</span>
        <span class="menu-card-go">Gestionar →</span>
      </button>
      <button class="menu-card" id="mc-how" type="button">
        <span class="menu-card-tag">Ayuda</span>
        <span class="menu-card-title">Cómo se juega</span>
        <span class="menu-card-desc">Controles, sistema de carrera, subida de F2 a F1 y objetos.</span>
        <span class="menu-card-go">Ver guía →</span>
      </button>
    </div>
    <aside class="menu-side" id="menu-side"></aside>
  </main>
  <footer class="menu-foot">
    <span id="menu-foot-text">Todo ocurre en tu dispositivo. Sin anuncios, sin registro, sin Instalaciones.</span>
  </footer>
</div>

<!-- ══════════════════ APLICACIÓN ══════════════════ -->
<div id="app" class="app" hidden>
  <header class="appbar" id="appbar"></header>
  <div class="app-body" id="app-body"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root" hidden></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
